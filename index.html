<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kajian Islam - Fiqih Thoharoh | Ust. Umar Abu Abdillah</title>
    <!-- Tailwind CSS untuk styling modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

<!-- Header / Banner -->
<header class="bg-gradient-to-r from-[#0B1F4D] via-[#102F6B] to-[#1E5AA8] text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col sm:flex-row items-center gap-4">

        <!-- Logo Kajian -->
        <img src="https://raw.githubusercontent.com/gplusnation/thoharoh/main/IMG_20261011_110049.jpg"
             alt="Logo Kajian"
             class="w-20 h-20 rounded-full object-cover border-2 border-white shadow"
             onerror="this.src='https://via.placeholder.com/80?text=Logo'">

        <div class="text-center sm:text-left">
            <span class="bg-[#071735] text-blue-100 text-xs px-2.5 py-1 rounded-full uppercase tracking-wider font-semibold">
                Kajian Rutin
            </span>

            <h1 class="text-2xl sm:text-3xl font-bold mt-1">
                Fiqih Thoharoh
            </h1>

            <p class="text-blue-100 text-sm mt-0.5">
                Pemateri:
                <strong class="text-white">Ust. Umar Abu Abdillah</strong>
            </p>
        </div>

    </div>
</header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Kolom Kiri: Poster & Informasi -->
        <div class="md:col-span-1 space-y-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-semibold text-slate-700 mb-3 text-sm uppercase tracking-wider">Poster Kajian</h2>
                <img src="https://raw.githubusercontent.com/gplusnation/thoharoh/main/IMG_20261011_105754.jpg" 
                     alt="Poster Kajian" 
                     class="w-full rounded-lg shadow-sm object-cover hover:opacity-95 transition cursor-pointer"
                     onclick="window.open(this.src, '_blank')"
                     onerror="this.src='https://via.placeholder.com/300x400?text=Poster+Kajian'">
                <p class="text-xs text-slate-400 text-center mt-2">Klik poster untuk memperbesar</p>
            </div>

            
        </div>

        <!-- Kolom Kanan: Daftar Audio & Pemutar -->
        <div class="md:col-span-2 space-y-6">
            
            <!-- Audio Player Utama -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-2">Pemutar Audio</h2>
                <div id="current-playing-title" class="font-medium text-slate-800 mb-3 text-base">Pilih audio dari daftar untuk mulai mendengarkan</div>
                <audio id="audio-player" controls class="w-full focus:outline-none">
                    Browser Anda tidak mendukung elemen audio.
                </audio>
            </div>

            <!-- List Audio -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="font-semibold text-slate-700">Daftar Rekaman Kajian</h2>
                    <span id="total-audio" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">0 File</span>
                </div>
                
                <!-- List Item Container -->
                <div id="audio-list" class="divide-y divide-slate-100">
                    <div class="p-6 text-center text-slate-400 text-sm">Memuat daftar audio dari GitHub...</div>
                </div>

                <!-- Navigasi Paginasi -->
                <div id="pagination" class="p-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center" style="display: none;">
                    <!-- Tombol paginasi digenerate otomatis -->
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Kajian Fiqih Thoharoh - Ust. Umar Abu Abdillah
    </footer>

    <!-- Script Pengaturan Otomatis Audio, Penamaan & Paginasi -->
    <script>
        const GITHUB_USER = "gplusnation";
        const GITHUB_REPO = "thoharoh";
        
        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;
        let audioFiles = [];

        const audioPlayer = document.getElementById('audio-player');
        const currentTitleEl = document.getElementById('current-playing-title');
        const audioListEl = document.getElementById('audio-list');
        const totalAudioEl = document.getElementById('total-audio');
        const paginationEl = document.getElementById('pagination');

        // Mengambil daftar file audio dari folder /audio di GitHub
        async function fetchAudioFiles() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/audio`);
                if (!response.ok) {
                    throw new Error("Gagal mengambil data dari GitHub");
                }
                const data = await response.json();
                
                // Filter hanya file berekstensi audio
                audioFiles = data.filter(file => file.type === 'file' && /\.(mp3|m4a|wav|aac)$/i.test(file.name));
                
                totalAudioEl.textContent = `${audioFiles.length} File`;
                renderPage(currentPage);
            } catch (error) {
                console.error("Error:", error);
                audioListEl.innerHTML = `<div class="p-6 text-center text-slate-500 text-sm">
                    Belum ada file audio yang terdeteksi atau koneksi API terbatas.<br>
                    Pastikan file audio (.mp3) sudah diunggah ke folder <code>/audio</code> di repository GitHub Anda.
                </div>`;
                paginationEl.style.display = 'none';
            }
        }

        // Render halaman & list audio
        function renderPage(page) {
            currentPage = page;
            audioListEl.innerHTML = '';

            if (audioFiles.length === 0) {
                audioListEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">Belum ada rekaman audio tersedia.</div>`;
                paginationEl.style.display = 'none';
                return;
            }

            const startIndex = (page - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const paginatedItems = audioFiles.slice(startIndex, endIndex);

            paginatedItems.forEach((file, index) => {
                const absoluteIndex = startIndex + index + 1;
                
                // Otomatis menamai "Pertemuan 1", "Pertemuan 2", dst berdasarkan urutan file
                const meetingTitle = `Pertemuan ${absoluteIndex}`;
                
                const itemDiv = document.createElement('div');
                itemDiv.className = "p-4 flex items-center justify-between hover:bg-slate-50 transition cursor-pointer";
                itemDiv.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="bg-emerald-100 text-emerald-700 font-bold text-xs w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0">
                            ${absoluteIndex}
                        </div>
                        <div class="truncate">
                            <p class="text-sm font-medium text-slate-700 truncate">${meetingTitle}</p>
                            <span class="text-xs text-slate-400">Fiqih Thoharoh - Ust. Umar Abu Abdillah</span>
                        </div>
                    </div>
                    <button class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition flex-shrink-0 ml-2">
                        Putar
                    </button>
                `;

                // Klik baris untuk memutar audio
                itemDiv.addEventListener('click', () => {
                    playAudio(file.download_url, meetingTitle);
                });

                audioListEl.appendChild(itemDiv);
            });

            renderPaginationControls();
        }

        // Render Navigasi Paginasi (Page 1, 2, dst)
        function renderPaginationControls() {
            const totalPages = Math.ceil(audioFiles.length / ITEMS_PER_PAGE);
            paginationEl.innerHTML = '';

            if (totalPages <= 1) {
                paginationEl.style.display = 'none';
                return;
            }

            paginationEl.style.display = 'flex';

            // Tombol Sebelumnya
            const prevButton = document.createElement('button');
            prevButton.className = `px-3 py-1.5 text-xs font-medium rounded-lg border ${currentPage === 1 ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}`;
            prevButton.textContent = 'Sebelumnya';
            prevButton.disabled = currentPage === 1;
            prevButton.onclick = () => { if (currentPage > 1) renderPage(currentPage - 1); };
            paginationEl.appendChild(prevButton);

            // Teks Info Halaman
            const pageInfo = document.createElement('span');
            pageInfo.className = 'text-xs text-slate-600 font-medium';
            pageInfo.textContent = `Halaman ${currentPage} dari ${totalPages}`;
            paginationEl.appendChild(pageInfo);

            // Tombol Selanjutnya
            const nextButton = document.createElement('button');
            nextButton.className = `px-3 py-1.5 text-xs font-medium rounded-lg border ${currentPage === totalPages ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}`;
            nextButton.textContent = 'Selanjutnya';
            nextButton.disabled = currentPage === totalPages;
            nextButton.onclick = () => { if (currentPage < totalPages) renderPage(currentPage + 1); };
            paginationEl.appendChild(nextButton);
        }

        // Fungsi Memutar Audio & Memperbarui Judul Player
        function playAudio(url, title) {
            audioPlayer.src = url;
            currentTitleEl.textContent = title;
            audioPlayer.play().catch(e => console.log("Autoplay dicegah browser:", e));
        }

        // Jalankan saat pertama kali dimuat
        document.addEventListener('DOMContentLoaded', fetchAudioFiles);
    </script>
</body>
  </html>
